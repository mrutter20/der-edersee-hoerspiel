name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Find and extract Android project
    run: |
      ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)
      if [ -z "$ZIP_FILE" ]; then
        echo "Keine ZIP-Datei im Repository gefunden."
        exit 1
      fi
      mkdir -p extracted
      unzip -q "$ZIP_FILE" -d extracted
      PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
      if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "extracted" ]; then
        echo "Keine settings.gradle.kts im ZIP gefunden."
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Android-Projekt gefunden: $PROJECT_DIR"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Accept Android SDK licenses
    run: yes | sdkmanager --licenses || true

  - name: Build debug APK
    run: |
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Der-Edersee-debug-apk
      path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
